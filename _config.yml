# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#005bbb"      # University at Buffalo Blue
dark_mode: true              # show dark mode toggle in navbar
description: "Optimizing Artificial Intelligence Solutions and Infrastructure for Science (OASIS) Research Group website summarizing AI, data science, and machine learning research."
baseurl: ""
url: "https://ub-oasis.github.io"

# Google Analytics
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages
# ============================================================
nav_pages:
  - name: about
  - name: research
  - name: publications
  - name: team
  - name: teaching
  - name: news

# ============================================================
# Advanced Settings
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Chandola
  first_name: [Varun]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
  - vendor
